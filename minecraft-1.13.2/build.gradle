buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'kotlin'
apply plugin: 'eclipse'

version = acoustic_version
group = 'dev.acoustic'
archivesBaseName = 'acoustic-shaders-mc1132'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
compileKotlin.kotlinOptions.jvmTarget = '1.8'
compileKotlin.kotlinOptions.allWarningsAsErrors = true

minecraft {
    mappings channel: 'snapshot', version: '20180921-1.13'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'info'
            mods {
                acousticshaders {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    main {
        kotlin {
            srcDirs = [
                'src/main/kotlin',
                '../acoustic-api/src/main/kotlin',
                '../acoustic-platform-api/src/main/kotlin',
                '../acoustic-core/src/main/kotlin'
            ]
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // Development/runtime classpath only. The distributable runtime-delivery decision is
    // intentionally unresolved at this bootstrap stage; these dependencies are not shaded.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlin_version}"
}
